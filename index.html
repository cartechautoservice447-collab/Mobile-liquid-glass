<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Liquid Glass Studio — mobile-first study workspace" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/mobile-ui-overrides.css" />
    <link rel="stylesheet" href="/dashboard-phase1.css" />
    <link rel="stylesheet" href="/theme-controller.css" />
    <link rel="stylesheet" href="/course-create-reference.css" />
    <link rel="stylesheet" href="/course-create-reference-final.css" />
    <link rel="stylesheet" href="/dashboard-learning-suite.css" />
    <link rel="stylesheet" href="/dashboard-learning-suite-spacing.css" />
    <link rel="stylesheet" href="/dashboard-depth-parallax.css" media="(min-width: 701px)" />
    <link rel="stylesheet" href="/liquid-glass-ripple.css" />
    <link rel="stylesheet" href="/liquid-glass-morph.css" />
    <link rel="stylesheet" href="/liquid-glass-shimmer.css" />
    <link rel="stylesheet" href="/liquid-glass-fluid.css" />
    <link rel="stylesheet" href="/study-review-intelligence.css" />
    <link rel="stylesheet" href="/ai-study-intelligence.css" />
    <link rel="stylesheet" href="/p2-refinement.css" />
    <title>Liquid Glass Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const isMobile = window.matchMedia('(max-width: 700px)').matches;
        const desktopScripts = [
          '/dashboard-enhancer.js',
          '/dashboard-pomodoro.js',
          '/course-navigation-fix.js',
          '/theme-controller.js',
          '/theme-menu-position-fix.js',
          '/dashboard-learning-suite.js',
          '/dashboard-depth-parallax.js',
          '/liquid-glass-ripple.js',
          '/liquid-glass-morph.js',
          '/liquid-glass-fluid.js',
          '/liquid-glass-shimmer.js',
          '/ai-auth-scope.js',
          '/study-review-intelligence-v4.js',
          '/study-review-short-session-fix.js',
          '/ai-study-intelligence.js',
          '/ai-welcome-fix.js',
          '/ai-welcome-dedupe.js',
          '/p2-refinement.js'
        ];
        const mobileScripts = [
          '/dashboard-pomodoro.js',
          '/course-navigation-fix.js',
          '/theme-controller.js',
          '/theme-menu-position-fix.js',
          '/dashboard-learning-suite.js',
          '/p2-refinement.js'
        ];
        const scripts = isMobile ? mobileScripts : desktopScripts;
        const loadScripts = () => {
          for (const src of scripts) {
            const script = document.createElement('script');
            script.src = src;
            script.defer = true;
            script.crossOrigin = 'anonymous';
            document.body.appendChild(script);
          }
        };
        window.requestIdleCallback
          ? window.requestIdleCallback(loadScripts, { timeout: isMobile ? 2500 : 1200 })
          : window.setTimeout(loadScripts, isMobile ? 1200 : 0);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
