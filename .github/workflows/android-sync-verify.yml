name: Android sync verification

on:
  push:
    branches:
      - main
      - step8-android-device-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and sync web assets into Android
        run: npm run cap:sync

      - name: Verify Capacitor web assets
        run: |
          test -s dist/index.html
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/capacitor.config.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew test

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lint

      - name: Build debug Android APK
        working-directory: android
        run: ./gradlew app:assembleDebug

      - name: Verify debug APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke-test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and sync web assets into Android
        run: npm run cap:sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug Android APK
        working-directory: android
        run: ./gradlew app:assembleDebug

      - name: Boot Android emulator and smoke test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.liquidglass.studio
            adb shell monkey -p com.liquidglass.studio 1
            sleep 5
            adb shell pidof com.liquidglass.studio
            adb shell dumpsys package com.liquidglass.studio | grep -q 'com.liquidglass.studio'
            adb uninstall com.liquidglass.studio
