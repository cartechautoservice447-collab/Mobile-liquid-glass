name: Generate Capacitor Android project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: ${{ hashFiles('android/**') == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Verify generated project
        run: test -f android/gradlew && test -f android/settings.gradle && test -f android/app/build.gradle

      - name: Commit generated Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git rm .github/workflows/generate-android.yml
          git commit -m "Generate Capacitor Android project"
          git push
