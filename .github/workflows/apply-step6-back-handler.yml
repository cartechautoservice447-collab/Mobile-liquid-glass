name: Apply Step 6 back handler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch App.jsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old_import = "import { useEffect, useMemo, useState } from 'react';\n"
          new_import = old_import + "import { Capacitor } from '@capacitor/core';\nimport { App as CapacitorApp } from '@capacitor/app';\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('React import anchor not found')
              text = text.replace(old_import, new_import, 1)

          auth_effect = "  useEffect(() => {\n    if (!supabase) { setLoading(false); return undefined; }\n    let active = true;\n    supabase.auth.getSession().then(({ data }) => { if (active) { setSession(data.session); setLoading(false); } });\n    const { data: listener } = supabase.auth.onAuthStateChange((_event, nextSession) => setSession(nextSession));\n    return () => { active = false; listener.subscription.unsubscribe(); };\n  }, []);\n"

          back_effect = auth_effect + "\n  useEffect(() => {\n    if (!Capacitor.isNativePlatform()) return undefined;\n\n    let handle;\n    const register = async () => {\n      handle = await CapacitorApp.addListener('backButton', async () => {\n        if (courseCreateOpen) {\n          setCourseCreateOpen(false);\n          return;\n        }\n\n        if (action) {\n          setAction(null);\n          return;\n        }\n\n        switch (page) {\n          case 'editor':\n            setSelectedNoteId(null);\n            setPage('notes');\n            break;\n          case 'notes':\n            setPage('collections');\n            break;\n          case 'collections':\n            setPage('course-workspace');\n            break;\n          case 'course-notes':\n            setPage('course-workspace');\n            break;\n          case 'course-workspace':\n            setSelectedCollectionId(null);\n            setSelectedNoteId(null);\n            setPage('workspace');\n            break;\n          case 'courses':\n            setPage('workspace');\n            break;\n          default:\n            await CapacitorApp.exitApp();\n        }\n      });\n    };\n\n    register();\n    return () => { handle?.remove(); };\n  }, [action, courseCreateOpen, page]);\n"

          if "CapacitorApp.addListener('backButton'" not in text:
              if auth_effect not in text:
                  raise SystemExit('Auth effect anchor not found')
              text = text.replace(auth_effect, back_effect, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-step6-back-handler.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/apply-step6-back-handler.yml
          git commit -m "Handle Android back navigation in app shell"
          git push origin HEAD:main
