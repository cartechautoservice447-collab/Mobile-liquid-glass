name: Generate Android brand assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate launcher and splash PNGs from existing web icon
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image

          source = Path('public/icon.svg')
          if not source.exists():
              raise SystemExit('public/icon.svg not found')

          png_bytes = cairosvg.svg2png(url=str(source), output_width=512, output_height=512)
          icon = Image.open(BytesIO(png_bytes)).convert('RGBA')

          density_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in density_sizes.items():
              target = Path('android/app/src/main/res') / folder
              target.mkdir(parents=True, exist_ok=True)
              resized = icon.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(target / 'ic_launcher.png', optimize=True)
              resized.save(target / 'ic_launcher_round.png', optimize=True)
              resized.save(target / 'ic_launcher_foreground.png', optimize=True)

          # Keep the adaptive-icon background clean and native-looking.
          Path('android/app/src/main/res/values').mkdir(parents=True, exist_ok=True)
          (Path('android/app/src/main/res/values') / 'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n    <color name="ic_launcher_background">#07111F</color>\\n</resources>\\n'
          )

          # A dark native splash with the exact existing app icon centered.
          splash = Image.new('RGBA', (1080, 1920), (7, 17, 31, 255))
          splash_icon = icon.resize((288, 288), Image.Resampling.LANCZOS)
          splash.alpha_composite(splash_icon, ((1080 - 288) // 2, (1920 - 288) // 2))
          drawable = Path('android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          splash.save(drawable / 'splash.png', optimize=True)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/generate-android-brand-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res .github/workflows/generate-android-brand-assets.yml
          git commit -m "Use Liquid Glass branding for Android launcher and splash"
          git push origin HEAD:main
