name: Restore original dashboard source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore dashboard functions from ce8e8d7 while keeping current workspace/auth logic
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          path = Path('src/App.jsx')
          current = path.read_text(encoding='utf-8')
          original = subprocess.check_output(
              ['git', 'show', 'ce8e8d7a60874ce060e66906e2d47fd00bfd55d9:src/App.jsx'],
              text=True,
          )

          def block(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          # Restore the exact pre-593 dashboard source plus its two dashboard-owned
          # helper components. Everything outside these function blocks remains the
          # current main-branch implementation.
          current_dashboard_start = current.index('function Dashboard(')
          current_dashboard_end = current.index('function CourseCreateModal(', current_dashboard_start)
          original_dashboard_block = block(original, 'function Dashboard(', 'function CourseCreateModal(')
          current = current[:current_dashboard_start] + original_dashboard_block + current[current_dashboard_end:]

          # 593 also replaced these dashboard-owned modal components. Restore their
          # original source so the restored Dashboard does not call incompatible UI.
          current_course_modal = block(current, 'function CourseCreateModal(', 'function ActionModal(')
          original_course_modal = block(original, 'function CourseCreateModal(', 'function ActionModal(')
          current = current.replace(current_course_modal, original_course_modal, 1)

          current_action_modal = block(current, 'function ActionModal(', 'function CollectionsPage(')
          original_action_modal = block(original, 'function ActionModal(', 'function CollectionsPage(')
          current = current.replace(current_action_modal, original_action_modal, 1)

          path.write_text(current, encoding='utf-8')
          PY

      - name: Commit restoration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-dashboard-source.yml
          git add src/App.jsx .github/workflows/restore-dashboard-source.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore original dashboard source from ce8e8d7"
          git push origin HEAD:main
