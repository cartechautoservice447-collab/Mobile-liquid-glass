name: Fix Step 6 listener cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch App.jsx cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()
          old = """    let handle;\n    const register = async () => {\n      handle = await CapacitorApp.addListener('backButton', async () => {"""
          new = """    const register = async () => CapacitorApp.addListener('backButton', async () => {"""
          if old not in text:
              raise SystemExit('Expected listener registration anchor not found')
          text = text.replace(old, new, 1)

          old_end = """      });\n    };\n\n    register();\n    return () => { handle?.remove(); };\n  }, [action, courseCreateOpen, page]);"""
          new_end = """      });\n\n    const registration = register();\n    return () => { registration.then((handle) => handle.remove()); };\n  }, [action, courseCreateOpen, page]);"""
          if old_end not in text:
              raise SystemExit('Expected listener cleanup anchor not found')
          text = text.replace(old_end, new_end, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-step6-listener-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/fix-step6-listener-cleanup.yml
          git commit -m "Fix Android back listener cleanup"
          git push origin HEAD:main
