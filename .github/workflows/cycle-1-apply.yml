name: Apply Cycle 1 persistence patch

on:
  push:
    branches:
      - remediation/cycle-0-baseline

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[cycle1-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Cycle 1 code patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          text = app.read_text()

          text = text.replace(
              "import { loadCloudWorkspace, readLocalWorkspace, saveCloudWorkspace, writeLocalWorkspace } from './cloudWorkspace.js';",
              "import { deleteCloudCourse, deleteCloudNote, loadCloudWorkspace, readLocalWorkspace, saveCloudWorkspace, writeLocalWorkspace } from './cloudWorkspace.js';",
          )

          old_effect = """  useEffect(() => {\n    if (!workspaceReady) return;\n    writeLocalWorkspace(courses);\n    if (!session?.user?.id || !supabase) return;\n    const timer = setTimeout(() => {\n      saveCloudWorkspace(session.user.id, courses).catch((error) => {\n        setMessage(`Cloud save failed: ${error.message}`);\n      });\n    }, 450);\n    return () => clearTimeout(timer);\n  }, [courses, session?.user?.id, workspaceReady]);"""

          new_effect = """  useEffect(() => {\n    if (!workspaceReady) return;\n    writeLocalWorkspace(courses);\n  }, [courses, workspaceReady]);"""
          if old_effect not in text:
              raise SystemExit('Expected workspace persistence effect was not found')
          text = text.replace(old_effect, new_effect)

          marker = "  const openCourse = (id) => {"
          helper = """  const persistWorkspace = async (nextCourses) => {\n    writeLocalWorkspace(nextCourses);\n    setCourses(nextCourses);\n    if (!session?.user?.id || !supabase) return;\n    try {\n      await saveCloudWorkspace(session.user.id, nextCourses);\n    } catch (error) {\n      setMessage(`Cloud save failed: ${error.message}`);\n      throw error;\n    }\n  };\n\n"""
          if marker not in text:
              raise SystemExit('Could not locate workspace handler marker')
          text = text.replace(marker, helper + marker, 1)

          patterns = {
              r"const addCourse = \(event\) => \{ event\.preventDefault\(\); const name = newCourseName\.trim\(\); if \(!name\) return; const description = newCourseDescription\.trim\(\) \|\| 'New course workspace'; setCourses\(\(current\) => \[\.\.\.current, \{ id: `course-\$\{Date\.now\(\)\}`, name, description, color: newCourseColor, progress: 0, collections: \[\] \}\]\); closeCourseCreator\(\); setMessage\('Course created\.'\); setPage\('workspace'\); \};": "const addCourse = async (event) => { event.preventDefault(); const name = newCourseName.trim(); if (!name) return; const description = newCourseDescription.trim() || 'New course workspace'; const nextCourse = { id: `course-${Date.now()}`, name, description, color: newCourseColor, progress: 0, collections: [] }; await persistWorkspace([...courses, nextCourse]); closeCourseCreator(); setMessage('Course created.'); setPage('workspace'); };",
              r"const updateCourse = \(patch\) => \{ if \(!selectedCourseId\) return; setCourses\(\(current\) => current\.map\(\(course\) => course\.id === selectedCourseId \? \{ \.\.\.course, \.\.\.patch \} : course\)\); setMessage\('Course updated\.'\); \};": "const updateCourse = async (patch) => { if (!selectedCourseId) return; const nextCourses = courses.map((course) => course.id === selectedCourseId ? { ...course, ...patch } : course); await persistWorkspace(nextCourses); setMessage('Course updated.'); };",
              r"const deleteCourse = \(id\) => \{ setCourses\(\(current\) => current\.filter\(\(course\) => course\.id !== id\)\); setSelectedCourseId\(null\); setPage\('workspace'\); setMessage\('Course deleted\.'\); \};": "const deleteCourse = async (id) => { const nextCourses = courses.filter((course) => course.id !== id); await persistWorkspace(nextCourses); if (session?.user?.id) await deleteCloudCourse(session.user.id, id); setSelectedCourseId(null); setPage('workspace'); setMessage('Course deleted.'); };",
              r"const addCollection = \(event\) => \{ event\.preventDefault\(\); const title = newCollectionName\.trim\(\); if \(!title \|\| !selectedCourseId\) return; setCourses\(\(current\) => current\.map\(\(course\) => course\.id === selectedCourseId \? \{ \.\.\.course, collections: \[\.\.\.course\.collections, \{ id: `collection-\$\{Date\.now\(\)\}`, title, description: 'New collection', notes: \[\] \} \] \} : course\)\); setNewCollectionName\(''\); setMessage\('Collection created\.'\); \};": "const addCollection = async (event) => { event.preventDefault(); const title = newCollectionName.trim(); if (!title || !selectedCourseId) return; const nextCourses = courses.map((course) => course.id === selectedCourseId ? { ...course, collections: [...course.collections, { id: `collection-${Date.now()}`, title, description: 'New collection', notes: [] }] } : course); await persistWorkspace(nextCourses); setNewCollectionName(''); setMessage('Collection created.'); };",
              r"const addNote = \(event\) => \{ event\?\.preventDefault\(\); if \(!selectedCourseId \|\| !selectedCollectionId\) return; const noteId = `note-\$\{Date\.now\(\)\}`; const now = Date\.now\(\); const title = newNoteName\.trim\(\) \|\| 'New Note'; setCourses\(\(current\) => current\.map\(\(course\) => course\.id !== selectedCourseId \? course : \{ \.\.\.course, collections: course\.collections\.map\(\(collection\) => collection\.id !== selectedCollectionId \? collection : \{ \.\.\.collection, notes: \[\.\.\.collection\.notes, \{ id: noteId, title, content: '', createdAt: now, updatedAt: now \} \] \} \) \}\)\); setNewNoteName\(''\); setSelectedNoteId\(noteId\); setEditorContent\(''\); setPage\('notes'\); setMessage\('New note created\.'\); \};": "const addNote = async (event) => { event?.preventDefault(); if (!selectedCourseId || !selectedCollectionId) return; const noteId = `note-${Date.now()}`; const now = Date.now(); const title = newNoteName.trim() || 'New Note'; const nextCourses = courses.map((course) => course.id !== selectedCourseId ? course : { ...course, collections: course.collections.map((collection) => collection.id !== selectedCollectionId ? collection : { ...collection, notes: [...collection.notes, { id: noteId, title, content: '', createdAt: now, updatedAt: now }] }) }); await persistWorkspace(nextCourses); setNewNoteName(''); setSelectedNoteId(noteId); setEditorContent(''); setPage('notes'); setMessage('New note created.'); };",
              r"const saveNote = \(\) => \{ if \(!selectedCourseId \|\| !selectedCollectionId \|\| !selectedNoteId\) return; setCourses\(\(current\) => current\.map\(\(course\) => course\.id !== selectedCourseId \? course : \{ \.\.\.course, collections: course\.collections\.map\(\(collection\) => collection\.id !== selectedCollectionId \? collection : \{ \.\.\.collection, notes: collection\.notes\.map\(\(note\) => note\.id === selectedNoteId \? \{ \.\.\.note, content: editorContent, updatedAt: Date\.now\(\) \} : note\) \} \) \}\)\); setMessage\('Note saved\.'\); \};": "const saveNote = async () => { if (!selectedCourseId || !selectedCollectionId || !selectedNoteId) return; const nextCourses = courses.map((course) => course.id !== selectedCourseId ? course : { ...course, collections: course.collections.map((collection) => collection.id !== selectedCollectionId ? collection : { ...collection, notes: collection.notes.map((note) => note.id === selectedNoteId ? { ...note, content: editorContent, updatedAt: Date.now() } : note) }) }); await persistWorkspace(nextCourses); setMessage('Note saved.'); };",
              r"const saveCollectionNote = \(draft\) => \{ if \(!selectedCourseId \|\| !selectedCollectionId \|\| !draft\?\.id\) return; setCourses\(\(current\) => current\.map\(\(course\) => course\.id !== selectedCourseId \? course : \{ \.\.\.course, collections: course\.collections\.map\(\(collection\) => collection\.id !== selectedCollectionId \? collection : \{ \.\.\.collection, notes: collection\.notes\.map\(\(note\) => note\.id === draft\.id \? \{ \.\.\.note, title: draft\.title, content: draft\.content, updatedAt: Date\.now\(\) \} : note\) \} \) \}\)\); setMessage\('Note saved\.'\); \};": "const saveCollectionNote = async (draft) => { if (!selectedCourseId || !selectedCollectionId || !draft?.id) return; const nextCourses = courses.map((course) => course.id !== selectedCourseId ? course : { ...course, collections: course.collections.map((collection) => collection.id !== selectedCollectionId ? collection : { ...collection, notes: collection.notes.map((note) => note.id === draft.id ? { ...note, title: draft.title, content: draft.content, updatedAt: Date.now() } : note) }) }); await persistWorkspace(nextCourses); setMessage('Note saved.'); };",
              r"const deleteCollectionNote = \(noteId\) => \{ setCourses\(\(current\) => current\.map\(\(course\) => course\.id !== selectedCourseId \? course : \{ \.\.\.course, collections: course\.collections\.map\(\(collection\) => collection\.id !== selectedCollectionId \? collection : \{ \.\.\.collection, notes: collection\.notes\.filter\(\(note\) => note\.id !== noteId\) \} \) \}\)\); setSelectedNoteId\(null\); setMessage\('Note deleted\.'\); \};": "const deleteCollectionNote = async (noteId) => { const nextCourses = courses.map((course) => course.id !== selectedCourseId ? course : { ...course, collections: course.collections.map((collection) => collection.id !== selectedCollectionId ? collection : { ...collection, notes: collection.notes.filter((note) => note.id !== noteId) }) }); await persistWorkspace(nextCourses); if (session?.user?.id) await deleteCloudNote(session.user.id, noteId); setSelectedNoteId(null); setMessage('Note deleted.'); };",
          }
          for pat, repl in patterns.items():
              text2, n = re.subn(pat, repl, text)
              if n != 1:
                  raise SystemExit(f'Patch pattern matched {n} times: {pat[:80]}')
              text = text2

          app.write_text(text)

          hook = Path('src/useEngineSettings.js')
          hook.write_text(r'''import { useCallback, useEffect, useMemo, useState } from 'react';
import { supabase } from './lib/supabase.js';

export const ENGINE_DEFAULTS = {
  displayName: '', uiTextClarity: 'default', performance: 'high', theme: 'light', glassTheme: 'type-1',
  pureBlack: false, backgroundThemeEnabled: false, backgroundOpacity: 100, backgroundBrightness: 100,
  fullDarkBackground: false, liquidDensity: 12, liquidTransparency: 45, liquidClearness: 35, liquidGel: 55,
  bounceStiffness: 200, bounceDamping: 24,
};

const LEGACY_PERFORMANCE_KEY = 'mobile-liquid-glass-performance';
const STORAGE_PREFIX = 'mobile-liquid-glass-engine-v1';
const CLARITY_VALUES = ['default', 'smooth', 'medium', 'punchy'];
const GLASS_THEME_VALUES = ['type-1', 'type-2', 'type-3', 'type-4'];
const clamp = (value, min, max, fallback) => { const numeric = Number(value); return Number.isFinite(numeric) ? Math.min(max, Math.max(min, numeric)) : fallback; };
const scopeKey = (userId, suffix) => `${STORAGE_PREFIX}:${userId || 'guest'}:${suffix}`;
const readStored = (key, fallback, parse = (value) => value) => { try { const raw = localStorage.getItem(key); return raw == null ? fallback : parse(raw); } catch { return fallback; } };
const writeStored = (key, value) => { try { localStorage.setItem(key, String(value)); } catch {} };

const normalize = (raw = {}) => ({
  displayName: String(raw.displayName || '').trim().slice(0, 40),
  uiTextClarity: CLARITY_VALUES.includes(raw.uiTextClarity) ? raw.uiTextClarity : ENGINE_DEFAULTS.uiTextClarity,
  performance: raw.performance === 'ultra' ? 'ultra' : 'high',
  theme: raw.theme === 'dark' ? 'dark' : 'light',
  glassTheme: GLASS_THEME_VALUES.includes(raw.glassTheme) ? raw.glassTheme : ENGINE_DEFAULTS.glassTheme,
  pureBlack: Boolean(raw.pureBlack), backgroundThemeEnabled: Boolean(raw.backgroundThemeEnabled),
  backgroundOpacity: clamp(raw.backgroundOpacity, 0, 100, ENGINE_DEFAULTS.backgroundOpacity),
  backgroundBrightness: clamp(raw.backgroundBrightness, 0, 200, ENGINE_DEFAULTS.backgroundBrightness),
  fullDarkBackground: Boolean(raw.fullDarkBackground), liquidDensity: clamp(raw.liquidDensity, 0, 40, ENGINE_DEFAULTS.liquidDensity),
  liquidTransparency: clamp(raw.liquidTransparency, 5, 95, ENGINE_DEFAULTS.liquidTransparency),
  liquidClearness: clamp(raw.liquidClearness, 0, 100, ENGINE_DEFAULTS.liquidClearness), liquidGel: clamp(raw.liquidGel, 0, 100, ENGINE_DEFAULTS.liquidGel),
  bounceStiffness: clamp(raw.bounceStiffness, 100, 500, ENGINE_DEFAULTS.bounceStiffness), bounceDamping: clamp(raw.bounceDamping, 10, 40, ENGINE_DEFAULTS.bounceDamping),
});

export default function useEngineSettings(userId) {
  const [settings, setSettings] = useState(ENGINE_DEFAULTS);
  const [hydratedUser, setHydratedUser] = useState(null);

  useEffect(() => {
    let active = true;
    const scope = userId || 'guest';
    setHydratedUser(null);
    const localRaw = Object.fromEntries([
      ['displayName',''],['uiTextClarity','default'],['performance','high'],['theme','light'],['glassTheme','type-1'],['pureBlack','false'],['backgroundThemeEnabled','false'],['backgroundOpacity','100'],['backgroundBrightness','100'],['fullDarkBackground','false'],['liquidDensity','12'],['liquidTransparency','45'],['liquidClearness','35'],['liquidGel','55'],['bounceStiffness','200'],['bounceDamping','24'],
    ].map(([suffix, fallback]) => [suffix, readStored(scopeKey(scope, suffix), fallback)]));
    const local = normalize({
      displayName: localRaw.displayName, uiTextClarity: localRaw.uiTextClarity, performance: localRaw.performance || readStored(LEGACY_PERFORMANCE_KEY, 'high'), theme: localRaw.theme, glassTheme: localRaw.glassTheme,
      pureBlack: localRaw.pureBlack === 'true', backgroundThemeEnabled: localRaw.backgroundThemeEnabled === 'true', backgroundOpacity: localRaw.backgroundOpacity, backgroundBrightness: localRaw.backgroundBrightness,
      fullDarkBackground: localRaw.fullDarkBackground === 'true', liquidDensity: localRaw.liquidDensity, liquidTransparency: localRaw.liquidTransparency, liquidClearness: localRaw.liquidClearness, liquidGel: localRaw.liquidGel, bounceStiffness: localRaw.bounceStiffness, bounceDamping: localRaw.bounceDamping,
    });
    setSettings(local);
    if (!userId || !supabase) { setHydratedUser(scope); return () => { active = false; }; }
    supabase.from('profiles').select('engine_settings').eq('id', userId).maybeSingle().then(({ data, error }) => {
      if (!active) return;
      if (error) { console.warn('Engine Settings cloud load failed; using local cache.', error); setHydratedUser(userId); return; }
      const cloud = normalize(data?.engine_settings || {});
      const merged = data?.engine_settings && Object.keys(data.engine_settings).length ? cloud : local;
      setSettings(merged);
      setHydratedUser(userId);
    }).catch((error) => { if (active) { console.warn('Engine Settings cloud load failed; using local cache.', error); setHydratedUser(userId); } });
    return () => { active = false; };
  }, [userId]);

  useEffect(() => {
    if (!hydratedUser) return;
    Object.entries(settings).forEach(([key, value]) => writeStored(scopeKey(hydratedUser, key.replace(/[A-Z]/g, (m) => `-${m.toLowerCase()}`)), value));
    writeStored(LEGACY_PERFORMANCE_KEY, settings.performance);
    if (hydratedUser === 'guest' || !supabase) return;
    const timer = setTimeout(() => {
      supabase.from('profiles').upsert({ id: hydratedUser, engine_settings: settings }, { onConflict: 'id' }).then(({ error }) => {
        if (error) console.warn('Engine Settings cloud save failed.', error);
      });
    }, 250);
    return () => clearTimeout(timer);
  }, [hydratedUser, settings]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', settings.theme === 'dark');
    document.documentElement.style.colorScheme = settings.theme;
    document.documentElement.classList.toggle('pure-black', settings.pureBlack);
    document.documentElement.dataset.backgroundTheme = settings.backgroundThemeEnabled ? 'on' : 'off';
    document.documentElement.dataset.fullDarkBackground = settings.fullDarkBackground ? 'on' : 'off';
    document.documentElement.dataset.uiTextClarity = settings.uiTextClarity;
    document.documentElement.dataset.glassPerformance = settings.performance;
    document.documentElement.dataset.glassTheme = settings.glassTheme;
    const transparency = settings.liquidTransparency / 100, density = settings.liquidDensity, clearness = settings.liquidClearness / 100, gel = settings.liquidGel / 100;
    const root = document.documentElement;
    root.style.setProperty('--liquid-density', `${density}px`); root.style.setProperty('--liquid-transparency', String(transparency)); root.style.setProperty('--liquid-glass-alpha', String(transparency)); root.style.setProperty('--liquid-glass-dark-alpha', String(transparency * 0.16)); root.style.setProperty('--liquid-veil-alpha', String(transparency * 0.36)); root.style.setProperty('--liquid-dark-veil-alpha', String(transparency <= 0.45 ? 0.0775 + 0.45 * transparency : 0.46 - 0.4 * transparency)); root.style.setProperty('--liquid-clearness', String(clearness)); root.style.setProperty('--liquid-gel', String(gel)); root.style.setProperty('--liquid-bounce', String(settings.bounceStiffness)); root.style.setProperty('--liquid-bounce-damping', String(settings.bounceDamping)); root.style.setProperty('--background-opacity', String(settings.backgroundOpacity / 100)); root.style.setProperty('--background-brightness', String(settings.backgroundBrightness / 100)); root.style.setProperty('--liquid-motion-duration', `${Math.round(420 - (settings.bounceStiffness - 100) * 0.7)}ms`);
    const opacity = settings.backgroundOpacity / 100;
    document.body.style.background = settings.pureBlack ? '#000' : settings.fullDarkBackground ? '#050507' : settings.backgroundThemeEnabled ? (settings.theme === 'dark' ? `radial-gradient(circle at 20% 0%, rgb(23 59 98 / ${opacity}) 0, transparent 45%), radial-gradient(circle at 100% 100%, rgb(44 22 93 / ${opacity}) 0, transparent 48%), #07111f` : `radial-gradient(circle at 20% 0%, rgb(110 197 255 / ${opacity}) 0, transparent 45%), radial-gradient(circle at 100% 100%, rgb(171 126 255 / ${opacity}) 0, transparent 48%), #eef4fb`) : (settings.theme === 'dark' ? '#07111f' : '#eef4fb');
    window.dispatchEvent(new CustomEvent('glass-settings-changed'));
  }, [settings]);

  useEffect(() => { const onPerformanceChange = (event) => setSettings((current) => ({ ...current, performance: event.detail === 'ultra' ? 'ultra' : 'high' })); window.addEventListener('glass-performance-changed', onPerformanceChange); return () => window.removeEventListener('glass-performance-changed', onPerformanceChange); }, []);

  const update = useCallback((key, value) => setSettings((current) => {
    if (key === 'displayName') return { ...current, displayName: String(value).trim().slice(0, 40) };
    if (key === 'uiTextClarity') return { ...current, uiTextClarity: CLARITY_VALUES.includes(value) ? value : current.uiTextClarity };
    if (key === 'performance') return { ...current, performance: value === 'ultra' ? 'ultra' : 'high' };
    if (key === 'theme') return { ...current, theme: value === 'dark' ? 'dark' : 'light' };
    if (key === 'glassTheme') return { ...current, glassTheme: GLASS_THEME_VALUES.includes(value) ? value : current.glassTheme };
    if (['pureBlack','backgroundThemeEnabled','fullDarkBackground'].includes(key)) return { ...current, [key]: Boolean(value) };
    if (['backgroundOpacity','backgroundBrightness','liquidDensity','liquidTransparency','liquidClearness','liquidGel','bounceStiffness','bounceDamping'].includes(key)) return { ...current, [key]: normalize({ [key]: value })[key] };
    return current;
  }), []);
  const reset = useCallback(() => setSettings(ENGINE_DEFAULTS), []);
  return useMemo(() => ({ settings, setSetting: update, reset }), [settings, update, reset]);
}
''')
          PY

          git config user.name "cycle-1-bot"
          git config user.email "cycle-1-bot@users.noreply.github.com"
          git add src/App.jsx src/useEngineSettings.js
          git commit -m "Cycle 1: persist workspace and engine settings [cycle1-applied]"
          git push origin HEAD:remediation/cycle-0-baseline

      - name: Remove one-time patch workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/cycle-1-apply.yml || true
          git config user.name "cycle-1-bot"
          git config user.email "cycle-1-bot@users.noreply.github.com"
          git commit -m "Cycle 1: remove one-time patch workflow [cycle1-cleanup]" || true
          git push origin HEAD:remediation/cycle-0-baseline || true
