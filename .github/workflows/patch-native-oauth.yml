name: Patch native OAuth callback

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove one-time OAuth patch workflow') && !contains(github.event.head_commit.message, 'Connect native Android OAuth callback') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch App.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()

          marker = "const SKIP_AUTH_KEY = 'mobile-liquid-glass-skip-auth';"
          native_redirect = "const NATIVE_AUTH_REDIRECT = 'com.liquidglass.studio://auth/callback';"
          if native_redirect not in text:
              if marker not in text:
                  raise SystemExit('auth key marker not found')
              text = text.replace(marker, marker + "\n" + native_redirect, 1)

          effect_anchor = "  useEffect(() => {\n    if (!Capacitor.isNativePlatform()) return undefined;\n\n    const register = async () => CapacitorApp.addListener('backButton'"
          if "CapacitorApp.addListener('appUrlOpen'" not in text:
              oauth_effect = """  useEffect(() => {
    if (!Capacitor.isNativePlatform() || !supabase) return undefined;

    const handleAuthUrl = async (url) => {
      if (!url || !url.startsWith(NATIVE_AUTH_REDIRECT)) return;

      const callbackUrl = new URL(url);
      const code = callbackUrl.searchParams.get('code');
      const errorDescription = callbackUrl.searchParams.get('error_description');

      if (errorDescription) {
        setMessage(decodeURIComponent(errorDescription.replace(/\\+/g, ' ')));
        setBusy(false);
        return;
      }

      if (!code) return;

      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error) {
        setMessage(error.message);
        setBusy(false);
        return;
      }

      localStorage.removeItem(SKIP_AUTH_KEY);
      setSkippedAuth(false);
      setPage('workspace');
      setMessage('Signed in successfully.');
      setBusy(false);
    };

    let active = true;
    const register = async () => {
      const handle = await CapacitorApp.addListener('appUrlOpen', ({ url }) => {
        if (active) void handleAuthUrl(url);
      });

      const launch = await CapacitorApp.getLaunchUrl();
      if (active && launch?.url) void handleAuthUrl(launch.url);

      return handle;
    };

    const registration = register();
    return () => {
      active = false;
      registration.then((handle) => handle.remove());
    };
  }, []);

""" + effect_anchor
              if effect_anchor not in text:
                  raise SystemExit('back-button effect anchor not found')
              text = text.replace(effect_anchor, oauth_effect, 1)

          old_google = "const signInWithGoogle = async () => { if (!supabase) return; setBusy(true); setMessage(''); const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin, queryParams: { prompt: 'select_account' } } }); if (error) { setMessage(error.message); setBusy(false); } };"
          new_google = "const signInWithGoogle = async () => { if (!supabase) return; setBusy(true); setMessage(''); const redirectTo = Capacitor.isNativePlatform() ? NATIVE_AUTH_REDIRECT : window.location.origin; const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo, queryParams: { prompt: 'select_account' } } }); if (error) { setMessage(error.message); setBusy(false); } };"
          if old_google not in text:
              raise SystemExit('Google sign-in function not found')
          text = text.replace(old_google, new_google, 1)
          path.write_text(text)
          PY

      - name: Verify OAuth callback wiring
        run: |
          grep -q "NATIVE_AUTH_REDIRECT = 'com.liquidglass.studio://auth/callback'" src/App.jsx
          grep -q "appUrlOpen" src/App.jsx
          grep -q "exchangeCodeForSession" src/App.jsx
          grep -q "redirectTo = Capacitor.isNativePlatform()" src/App.jsx
          grep -q 'android:scheme="com.liquidglass.studio"' android/app/src/main/AndroidManifest.xml

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx android/app/src/main/AndroidManifest.xml .github/workflows/patch-native-oauth.yml
          git commit -m "Connect native Android OAuth callback"
          git rm .github/workflows/patch-native-oauth.yml
          git commit -m "Remove one-time OAuth patch workflow"
          git push
